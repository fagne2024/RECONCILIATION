<VirtualHost *:80>
    ServerName dev.reconciliation.intouchgroup.net
    Redirect permanent / https://dev.reconciliation.intouchgroup.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.reconciliation.intouchgroup.net

    SSLEngine on
    # Certificat dédié DEV (recommandé) — ou wildcard *.intouchgroup.net
    SSLCertificateFile "C:/Apache24/conf/ssl/dev.reconciliation.intouchgroup.net.fullchain.pem"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/dev.reconciliation.intouchgroup.net.key"
    # Fallback si certificat wildcard partagé :
    # SSLCertificateFile "C:/Apache24/conf/ssl/reconciliation.intouchgroup.net.fullchain.pem"
    # SSLCertificateKeyFile "C:/Apache24/conf/ssl/reconciliation.intouchgroup.net.key"

    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), sync-xhr=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Header always set Cross-Origin-Embedder-Policy "credentialless"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always unset X-Powered-By

    # Bandeau visuel pour rappeler l'environnement DEV (optionnel)
    Header always set X-Environment "DEV"

    Header always set Access-Control-Allow-Origin "https://dev.reconciliation.intouchgroup.net"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Allow-Credentials "true"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json application/xml
        AddOutputFilterByType DEFLATE application/rss+xml application/xhtml+xml
    </IfModule>

    DocumentRoot "C:/reconciliation-app/frontend/dist-dev/csv-reconciliation"
    <Directory "C:/reconciliation-app/frontend/dist-dev/csv-reconciliation">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    AddDefaultCharset UTF-8
    AddCharset UTF-8 .html .css .js .xml .json .txt

    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </FilesMatch>

    ProxyPreserveHost On
    ProxyRequests Off

    # Backend DEV sur le port 8081 (prod = 8080)
    ProxyPass "/health" "http://localhost:8081/actuator/health"
    ProxyPassReverse "/health" "http://localhost:8081/actuator/health"

    ProxyPass "/api/" "http://localhost:8081/api/"
    ProxyPassReverse "/api/" "http://localhost:8081/api/"

    ProxyTimeout 1800
    Timeout 1800
    ProxyBadHeader Ignore
    ProxyErrorOverride Off

    LimitRequestBody 524288000

    ErrorLog "logs/reconciliation-dev-ssl-error.log"
    CustomLog "logs/reconciliation-dev-ssl-access.log" combined
    LogLevel warn
</VirtualHost>
