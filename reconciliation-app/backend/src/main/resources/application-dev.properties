# Configuration environnement DEV (tests utilisateurs, même serveur que la prod)
# Démarrage : SPRING_PROFILES_ACTIVE=dev  (port 8081, base top20_dev)

spring.datasource.url=jdbc:mysql://localhost:3306/top20_dev?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_DEV_USERNAME:root}
spring.datasource.password=${DB_DEV_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schéma auto-mis à jour en DEV (pas de validate comme en prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Backend HTTP derrière Apache (prod = 8080, dev = 8081)
server.port=8081
server.address=0.0.0.0
server.ssl.enabled=false

server.server-header=

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.h2.console.enabled=false

logging.level.org.springframework=INFO
logging.level.com.reconciliation=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/application-dev.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${java.io.tmpdir}

server.tomcat.connection-timeout=1800000
server.tomcat.max-http-form-post-size=500MB

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

server.error.include-stacktrace=on_param
server.error.include-message=always

# CORS et URL frontend DEV
app.cors.allowed-origins=${APP_DEV_ALLOWED_ORIGINS:https://dev.reconciliation.intouchgroup.net,http://dev.reconciliation.intouchgroup.net,http://localhost:8089,http://127.0.0.1:8089,http://localhost:8082,http://127.0.0.1:8082,http://localhost:8444,https://localhost:8444,http://reconciliation.intouchgroup.net:8444,https://reconciliation.intouchgroup.net:8444}
app.url=${APP_DEV_URL:https://dev.reconciliation.intouchgroup.net}

# Emails : préfixe [DEV] via variable (évite confusion avec la prod)
spring.mail.properties.mail.smtp.from=${MAIL_DEV_FROM:touch@intouchgroup.net}

jwt.secret=${JWT_DEV_SECRET:${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-required-for-hmac-sha256}}
jwt.expiration=86400000

rate.limit.enabled=true
rate.limit.requests-per-minute=200
rate.limit.requests-per-hour=5000
rate.limit.by-ip=false
rate.limit.expose-headers=true
rate.limit.exclude-ecart-bo-summary-api=true
