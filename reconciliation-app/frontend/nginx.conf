 server {
   listen 80;
   server_name _;

   root /usr/share/nginx/html;
   index index.html;

   # Forcer UTF-8 pour toutes les réponses
   charset utf-8;

   # ========================================
   # EN-TÊTES DE SÉCURITÉ HTTP
   # ========================================
   
   # Protection contre le clickjacking
   add_header X-Frame-Options "DENY" always;
   
   # Protection contre le MIME type sniffing
   add_header X-Content-Type-Options "nosniff" always;
   
   # Protection XSS (Cross-Site Scripting)
   add_header X-XSS-Protection "1; mode=block" always;
   
   # Strict Transport Security - Force HTTPS (si vous utilisez HTTPS)
   # Décommentez si vous avez HTTPS configuré
   # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
   
   # Referrer Policy - Contrôle des informations de référent
   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
   
   # Permissions Policy - Contrôle des fonctionnalités du navigateur
   add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), sync-xhr=()" always;
   
   # Content Security Policy - Protection contre les attaques XSS et injection
   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
   
   # Cross-Origin policies
   add_header Cross-Origin-Embedder-Policy "credentialless" always;
   add_header Cross-Origin-Resource-Policy "same-origin" always;
   add_header Cross-Origin-Opener-Policy "same-origin" always;
   
   # Masquer la version de nginx
   server_tokens off;
   
   # Masquer X-Powered-By provenant du backend
   proxy_hide_header X-Powered-By;

   # ========================================
   # CONFIGURATION DES ROUTES
   # ========================================

   location / {
     try_files $uri $uri/ /index.html;
     add_header Content-Type "text/html; charset=utf-8" always;
   }

   # Proxy /api to backend service for docker-compose
   location /api/ {
     proxy_pass http://backend:8080/;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     proxy_set_header Accept-Charset "UTF-8";
     
     # Masquer X-Powered-By pour les réponses proxy
     proxy_hide_header X-Powered-By;
     
     # Masquer les en-têtes de rate limiting (sécurité)
     proxy_hide_header X-RateLimit-Limit-PerMinute;
     proxy_hide_header X-RateLimit-Remaining-PerMinute;
     proxy_hide_header X-RateLimit-Limit-PerHour;
     proxy_hide_header X-RateLimit-Remaining-PerHour;
     proxy_hide_header X-RateLimit-Reset-Minute;
     proxy_hide_header X-RateLimit-Reset-Hour;
     
     # Timeouts pour les gros fichiers (30 minutes)
     proxy_connect_timeout 1800s;
     proxy_send_timeout 1800s;
     proxy_read_timeout 1800s;
     
     # Buffer pour les gros fichiers
     proxy_request_buffering off;
     proxy_buffering off;
   }
 }

