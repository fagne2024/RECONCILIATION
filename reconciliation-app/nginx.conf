server {
    listen 80;
    server_name reconciliation.intouchgroup.net;
    
    # Redirection vers HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reconciliation.intouchgroup.net;
    
    # Certificats SSL
    # Option 1: Certificat auto-signé (développement/test)
    # Décommentez ces lignes et commentez les lignes Let's Encrypt:
    # ssl_certificate /etc/ssl/reconciliation-app/reconciliation-app.fullchain.pem;
    # ssl_certificate_key /etc/ssl/reconciliation-app/reconciliation-app.key;
    
    # Option 2: Let's Encrypt (production)
    # Décommentez ces lignes et commentez les lignes certificat auto-signé:
    ssl_certificate C:/nginx/ssl/reconciliation.intouchgroup.net.fullchain.pem;
    ssl_certificate_key C:/nginx/ssl/reconciliation.intouchgroup.net.key;
    
    # Configuration SSL sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # En-têtes de sécurité HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), sync-xhr=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Cross-Origin policies
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Masquer X-Powered-By provenant du backend
    proxy_hide_header X-Powered-By;
    
    # Masquer les en-têtes de rate limiting (sécurité)
    proxy_hide_header X-RateLimit-Limit-PerMinute;
    proxy_hide_header X-RateLimit-Remaining-PerMinute;
    proxy_hide_header X-RateLimit-Limit-PerHour;
    proxy_hide_header X-RateLimit-Remaining-PerHour;
    proxy_hide_header X-RateLimit-Reset-Minute;
    proxy_hide_header X-RateLimit-Reset-Hour;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Logs
    access_log /var/log/nginx/reconciliation-app.access.log;
    error_log /var/log/nginx/reconciliation-app.error.log;
    
    # Configuration pour les fichiers statiques Angular
    location / {
        root /var/www/reconciliation-app/frontend/dist/csv-reconciliation;
        try_files $uri $uri/ /index.html;
        
        # Forcer UTF-8 pour les fichiers HTML et texte
        charset utf-8;
        add_header Content-Type "text/html; charset=utf-8" always;
        
        # Cache pour les assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API Backend - Reverse proxy vers Spring Boot
    location /api/ {
        proxy_pass https://localhost:8443/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Masquer X-Powered-By pour les réponses proxy
        proxy_hide_header X-Powered-By;
        
        # Masquer les en-têtes de rate limiting (sécurité)
        proxy_hide_header X-RateLimit-Limit-PerMinute;
        proxy_hide_header X-RateLimit-Remaining-PerMinute;
        proxy_hide_header X-RateLimit-Limit-PerHour;
        proxy_hide_header X-RateLimit-Remaining-PerHour;
        proxy_hide_header X-RateLimit-Reset-Minute;
        proxy_hide_header X-RateLimit-Reset-Hour;

        # Forcer UTF-8 pour les réponses
        proxy_set_header Accept-Charset "UTF-8";

        # Timeouts pour les gros fichiers (30 minutes pour 700k lignes)
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Buffer pour les gros fichiers
        proxy_request_buffering off;
        proxy_buffering off;
    }
    
    # Upload de fichiers - Pas de limite de taille pour Nginx
    client_max_body_size 500M;
    
    # Health check
    location /health {
        proxy_pass https://localhost:8443/actuator/health;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        access_log off;
    }
}
