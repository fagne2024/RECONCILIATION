 server {

     listen 80;

     server_name reco.example.com;



     root /opt/reconciliation/frontend;

     index index.html;



     # Angular SPA routing

     location / {

         try_files $uri $uri/ /index.html;

         add_header Cache-Control "public, max-age=300";

     }



     # Reverse proxy vers backend Spring Boot

     location /api/ {

         proxy_pass https://127.0.0.1:8443/;

         proxy_ssl_verify off;

         proxy_set_header Host $host;

         proxy_set_header X-Real-IP $remote_addr;

         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         proxy_set_header X-Forwarded-Proto $scheme;



         # Masquer X-Powered-By pour les réponses proxy

         proxy_hide_header X-Powered-By;
         
         # Masquer les en-têtes de rate limiting (sécurité)
         
         proxy_hide_header X-RateLimit-Limit-PerMinute;
         
         proxy_hide_header X-RateLimit-Remaining-PerMinute;
         
         proxy_hide_header X-RateLimit-Limit-PerHour;
         
         proxy_hide_header X-RateLimit-Remaining-PerHour;
         
         proxy_hide_header X-RateLimit-Reset-Minute;
         
         proxy_hide_header X-RateLimit-Reset-Hour;



         # Timeouts pour les gros fichiers (30 minutes)

         proxy_connect_timeout 1800s;

         proxy_send_timeout 1800s;

         proxy_read_timeout 1800s;



         # Buffer pour les gros fichiers

         proxy_request_buffering off;

         proxy_buffering off;

     }



    # En-têtes de sécurité HTTP

    add_header X-Frame-Options "DENY" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-XSS-Protection "1; mode=block" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=(), vibrate=(), fullscreen=(self), sync-xhr=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

 }

